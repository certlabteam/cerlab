# SEO 정적 쪽을 날마다 다시 뽑는다.
#
# 문항이 계속 늘어나는데 seo/ 는 사람이 admin 에서 눌러야 갱신됐다. 그러다 보니
# 새로 들어온 회차·자격증이 검색에 몇 주씩 안 잡혔다 - 실제로 경영지도사·
# 국내여행안내사·호텔관리사 33장이 통째로 빠져 있었다.
#
# 생성기는 공개 Firestore 읽기만 쓴다(서비스계정 키가 필요 없다). 그래서
# 이 워크플로에 비밀값을 하나도 안 둔다.
#
# 손으로 돌리려면 Actions 탭에서 'Run workflow'.
name: SEO 쪽 갱신

on:
  schedule:
    # 22:00 KST = 13:00 UTC. GitHub 은 UTC 로만 받는다.
    - cron: '0 13 * * *'
  workflow_dispatch:

# 저장소에 되밀어야 하므로 쓰기 권한을 준다.
permissions:
  contents: write

concurrency:
  group: seo-daily
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # package-lock.json 이 없어 npm ci 는 못 쓴다. 의존성은 firebase 하나뿐이다.
      - run: npm install --no-audit --no-fund

      - name: SEO 쪽 생성
        run: npm run seo:gen

      # ?v= 갱신은 로컬 pre-commit 훅이 하던 일이다. 훅은 여기서 안 도니 직접 부른다.
      - name: 자산 버전(?v=) 갱신
        run: npm run bump

      - name: 바뀐 것이 있으면 커밋
        run: |
          if git diff --quiet; then
            echo "바뀐 것이 없습니다. 넘어갑니다."
            exit 0
          fi
          git config user.name  'certlab-bot'
          git config user.email 'certlab.team@gmail.com'
          git add -A seo sitemap.xml robots.txt llms.txt *.html
          git commit -m "SEO 쪽 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d'))"
          git push
