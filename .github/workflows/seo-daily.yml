# SEO 정적 쪽을 날마다 다시 뽑는다.
#
# 문항이 계속 늘어나는데 seo/ 는 사람이 admin 에서 눌러야 갱신됐다. 그러다 보니
# 새로 들어온 회차·자격증이 검색에 몇 주씩 안 잡혔다 - 실제로 경영지도사·
# 국내여행안내사·호텔관리사 33장이 통째로 빠져 있었다.
#
# 생성기는 Firestore 읽기만 쓴다 - 서비스계정 키는 필요 없다.
# 다만 App Check 을 켜면 익명 읽기가 막히므로, 콘솔에 등록한 디버그 토큰
# 하나(APPCHECK_DEBUG_TOKEN)를 비밀값으로 둔다. 없어도 지금처럼 돈다.
#
# 손으로 돌리려면 Actions 탭에서 'Run workflow'.
name: SEO 쪽 갱신

on:
  schedule:
    # 22:00 KST = 13:00 UTC. GitHub 은 UTC 로만 받는다.
    - cron: '0 13 * * *'
  workflow_dispatch:

# 저장소에 되밀어야 하므로 쓰기 권한을 준다.
permissions:
  contents: write

concurrency:
  group: seo-daily
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # package-lock.json 이 없어 npm ci 는 못 쓴다. 의존성은 firebase 하나뿐이다.
      - run: npm install --no-audit --no-fund

      - name: SEO 쪽 생성
        run: npm run seo:gen
        env:
          # App Check 강제를 켜면 토큰 없는 읽기가 막힌다. 이 봇이 제일 먼저 죽는다.
          # 비밀값이 없으면 빈 값이 넘어가고 봇은 지금처럼 공개 읽기로 돈다.
          APPCHECK_DEBUG_TOKEN: ${{ secrets.APPCHECK_DEBUG_TOKEN }}

      # ?v= 는 건드리지 않는다. 이 워크플로가 만드는 것은 seo/ 와 sitemap 뿐이고
      # css·js 는 손대지 않으므로 버전 쿼리를 올릴 까닭이 없다. 한 번 넣어 봤다가
      # 자산이 그대로인데 해시만 26군데 뒤집혔다(윈도우 CRLF ↔ 러너 LF).

      - name: 바뀐 것이 있으면 커밋
        run: |
          git add -A seo sitemap.xml robots.txt llms.txt
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다. 넘어갑니다."
            exit 0
          fi
          git config user.name  'certlab-bot'
          git config user.email 'certlab.team@gmail.com'
          git commit -m "SEO 쪽 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d'))"
          git push
