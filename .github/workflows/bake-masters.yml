# 마스터(개념·표·암기·그래프·인터랙티브)를 시험별 정적 JSON 으로 날마다 굽는다.
#
# 학습앱이 시험을 열 때마다 concepts 모음 전체를 Firestore 에서 받아 접속 한 번에 읽기 2.9만이
# 들었다 - 2026-10 비용이 9월의 6.5배였다. 이제 앱은 masters/<시험>.json 을 받는다.
# 굽기 뒤에 생긴 카드는 앱이 문항 화면에서 id 로 하나씩 받으므로 하루 늦어도 비지 않는다.
#
# 읽기는 공개 REST(웹 키)뿐이라 비밀값이 필요 없다. 손으로 돌리려면 Actions 탭에서 'Run workflow'.
name: 마스터 굽기

on:
  schedule:
    # 21:40 KST = 12:40 UTC. SEO 쪽 갱신(13:00 UTC)보다 먼저 끝나 두 push 가 안 부딪힌다.
    - cron: '40 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bake-masters
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 굽기
        run: node scripts/bake-masters.mjs

      - name: 바뀐 것이 있으면 커밋
        run: |
          git add -A masters
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다. 넘어갑니다."
            exit 0
          fi
          git config user.name  'certlab-bot'
          git config user.email 'certlab.team@gmail.com'
          git commit -m "마스터 자동 굽기 ($(TZ=Asia/Seoul date '+%Y-%m-%d'))"
          git pull --rebase
          git push
